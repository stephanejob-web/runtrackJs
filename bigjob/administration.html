<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administration — La Plateforme_</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="calendrier.html">
                <img src="assets/logo.svg" alt="" width="26" height="26">
                La Plateforme<span class="text-primary">_</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navigation"
                aria-controls="navigation" aria-expanded="false" aria-label="Ouvrir la navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navigation">
                <ul class="navbar-nav me-auto" id="liens-navigation"></ul>
                <div class="d-flex flex-wrap align-items-center gap-2 py-2 py-lg-0" id="zone-compte"></div>
            </div>
        </div>
    </nav>

    <main class="container py-4">

        <h1 class="h4 mb-1">Administration</h1>
        <p class="text-secondary small">
            Nommez ou retirez des modérateurs et des administrateurs.
        </p>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">Membre</th>
                            <th scope="col">Rôle</th>
                            <th scope="col" class="text-end">Droits</th>
                        </tr>
                    </thead>
                    <tbody id="corps-membres"></tbody>
                </table>
            </div>
        </div>

        <p class="text-secondary small mt-3 mb-0">
            Vous ne pouvez pas retirer vos propres droits : cela vous ferait perdre l'accès à cette page.
        </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/donnees.js"></script>
    <script src="js/session.js"></script>
    <script src="js/administration.js"></script>
