<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calendrier — La Plateforme_</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <!-- ============ Barre de navigation, remplie par session.js ============ -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="calendrier.html">
                <img src="assets/logo.svg" alt="" width="26" height="26">
                La Plateforme<span class="text-primary">_</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navigation"
                aria-controls="navigation" aria-expanded="false" aria-label="Ouvrir la navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navigation">
                <ul class="navbar-nav me-auto" id="liens-navigation"></ul>
                <div class="d-flex flex-wrap align-items-center gap-2 py-2 py-lg-0" id="zone-compte"></div>
            </div>
        </div>
    </nav>

    <main class="container py-4">

        <div class="row g-4">

            <!-- Calendrier -->
            <div class="col-12 col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header d-flex flex-wrap align-items-center justify-content-between gap-2">
                        <h1 class="h5 mb-0" id="titre-mois"></h1>

                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-secondary" type="button" id="mois-precedent">&laquo;</button>
                            <button class="btn btn-outline-secondary" type="button" id="mois-aujourdhui">Aujourd'hui</button>
                            <button class="btn btn-outline-secondary" type="button" id="mois-suivant">&raquo;</button>
                        </div>
                    </div>

                    <div class="card-body">
                        <p class="text-secondary small">
                            Cliquez sur un jour à venir pour demander une autorisation de présence,
                            ou pour annuler votre demande. Les jours passés sont verrouillés.
                        </p>

                        <div class="calendrier-entetes" aria-hidden="true">
                            <span>Lun</span><span>Mar</span><span>Mer</span>
                            <span>Jeu</span><span>Ven</span><span>Sam</span><span>Dim</span>
                        </div>

                        <div class="calendrier-grille" id="grille-calendrier"></div>

                        <div class="d-flex flex-wrap gap-3 mt-3 small text-secondary">
                            <span><span class="puce puce-en_attente"></span> En attente</span>
                            <span><span class="puce puce-acceptee"></span> Acceptée</span>
                            <span><span class="puce puce-refusee"></span> Refusée</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Mes demandes -->
            <div class="col-12 col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h2 class="h6 mb-0">Mes demandes</h2>
                    </div>
                    <ul class="list-group list-group-flush" id="liste-demandes"></ul>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/donnees.js"></script>
    <script src="js/session.js"></script>
    <script src="js/calendrier.js"></script>
</body>

</html>
