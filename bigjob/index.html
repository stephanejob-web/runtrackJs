<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>La Plateforme_ — Présences</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body class="page-accueil">

    <div class="container py-5">
        <div class="row justify-content-center align-items-center g-5">

            <!-- Présentation -->
            <div class="col-12 col-lg-5 text-center text-lg-start">
                <img src="assets/logo.svg" alt="" width="56" height="56" class="mb-3">

                <h1 class="h2 fw-bold">La Plateforme<span class="text-primary">_</span></h1>
                <p class="lead text-secondary">Annoncez votre présence dans les locaux.</p>

                <p class="text-secondary small">
                    Réservé aux membres de l'école : seules les adresses
                    <strong>@laplateforme.io</strong> peuvent créer un compte.
                </p>

                <div class="alert alert-light border small mb-0 text-start" id="comptes-demo"></div>
            </div>

            <!-- Formulaires -->
            <div class="col-12 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <ul class="nav nav-pills nav-fill mb-4" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#onglet-connexion"
                                    type="button" role="tab">Connexion</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#onglet-inscription"
                                    type="button" role="tab">Inscription</button>
                            </li>
                        </ul>

                        <div class="tab-content">

                            <!-- Connexion -->
                            <div class="tab-pane fade show active" id="onglet-connexion" role="tabpanel">
                                <form id="formulaire-connexion" novalidate>
                                    <div class="mb-3">
                                        <label for="connexion-email" class="form-label">Adresse email</label>
                                        <input type="email" class="form-control" id="connexion-email"
                                            placeholder="prenom.nom@laplateforme.io" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="connexion-motdepasse" class="form-label">Mot de passe</label>
                                        <input type="password" class="form-control" id="connexion-motdepasse" required>
                                    </div>

                                    <div class="alert alert-danger py-2 small d-none" id="erreur-connexion"></div>

                                    <button type="submit" class="btn btn-primary w-100">Se connecter</button>
                                </form>
                            </div>

                            <!-- Inscription -->
                            <div class="tab-pane fade" id="onglet-inscription" role="tabpanel">
                                <form id="formulaire-inscription" novalidate>
                                    <div class="row g-3">
                                        <div class="col-6">
                                            <label for="inscription-prenom" class="form-label">Prénom</label>
                                            <input type="text" class="form-control" id="inscription-prenom" required>
                                        </div>

                                        <div class="col-6">
                                            <label for="inscription-nom" class="form-label">Nom</label>
                                            <input type="text" class="form-control" id="inscription-nom" required>
                                        </div>

                                        <div class="col-12">
                                            <label for="inscription-email" class="form-label">Adresse email</label>
                                            <input type="email" class="form-control" id="inscription-email"
                                                placeholder="prenom.nom@laplateforme.io" required>
                                        </div>

                                        <div class="col-12">
                                            <label for="inscription-motdepasse" class="form-label">Mot de passe</label>
                                            <input type="password" class="form-control" id="inscription-motdepasse"
                                                required>
                                            <div class="form-text">Six caractères au minimum.</div>
                                        </div>
                                    </div>

                                    <div class="alert alert-danger py-2 small d-none mt-3" id="erreur-inscription"></div>

                                    <button type="submit" class="btn btn-primary w-100 mt-3">Créer mon compte</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>

                <p class="text-center mt-3 mb-0">
                    <button type="button" class="btn btn-link btn-sm text-secondary" id="bouton-reinitialiser">
                        Réinitialiser les données de démonstration
                    </button>
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/donnees.js"></script>
    <script src="js/session.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
